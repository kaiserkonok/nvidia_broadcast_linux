<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NVBroadcast before and after preview">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ecc71"/>
      <stop offset="0.5" stop-color="#17c0b8"/>
      <stop offset="1" stop-color="#54a0ff"/>
    </linearGradient>
    <radialGradient id="softbg" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#1f5f57"/>
      <stop offset="0.6" stop-color="#173a52"/>
      <stop offset="1" stop-color="#101826"/>
    </radialGradient>
    <radialGradient id="subj" cx="0.42" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#9fb4c9"/>
    </radialGradient>
    <clipPath id="leftClip"><rect x="40" y="40" width="600" height="400" rx="18"/></clipPath>
    <clipPath id="rightClip"><rect x="640" y="40" width="600" height="400" rx="18"/></clipPath>
  </defs>

  <rect width="1280" height="520" fill="#0d0f14"/>

  <!-- BEFORE: dull, dark room -->
  <g clip-path="url(#leftClip)">
    <rect x="40" y="40" width="600" height="400" fill="#14171d"/>
    <path d="M340 460 C 190 460 190 340 190 340 C 190 300 260 300 340 300 C 420 300 490 300 490 340 C 490 340 490 460 340 460 Z" fill="#2c323d"/>
    <circle cx="340" cy="250" r="66" fill="#333a46"/>
  </g>

  <!-- AFTER: blurred/replaced bg + studio-lit subject -->
  <g clip-path="url(#rightClip)">
    <rect x="640" y="40" width="600" height="400" fill="url(#softbg)"/>
    <path d="M940 460 C 790 460 790 340 790 340 C 790 300 860 300 940 300 C 1020 300 1090 300 1090 340 C 1090 340 1090 460 940 460 Z" fill="url(#subj)"/>
    <path d="M940 460 C 790 460 790 340 790 340 C 790 300 860 300 940 300 C 1020 300 1090 300 1090 340" fill="none" stroke="url(#brand)" stroke-width="4" opacity="0.7"/>
    <circle cx="940" cy="250" r="66" fill="url(#subj)"/>
    <circle cx="940" cy="250" r="66" fill="none" stroke="url(#brand)" stroke-width="4" opacity="0.7"/>
  </g>

  <!-- frame + divider -->
  <rect x="40" y="40" width="600" height="400" rx="18" fill="none" stroke="#252b36" stroke-width="2"/>
  <rect x="640" y="40" width="600" height="400" rx="18" fill="none" stroke="#252b36" stroke-width="2"/>
  <line x1="640" y1="40" x2="640" y2="440" stroke="url(#brand)" stroke-width="3"/>
  <circle cx="640" cy="240" r="22" fill="#0d0f14" stroke="url(#brand)" stroke-width="3"/>
  <path d="M632 232 L648 240 L632 248 Z" fill="url(#brand)"/>

  <!-- labels -->
  <g font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-weight="700" font-size="22">
    <rect x="64" y="64" width="104" height="34" rx="17" fill="#0d0f14" stroke="#252b36"/>
    <text x="116" y="87" fill="#8b94a3" text-anchor="middle">BEFORE</text>
    <rect x="1120" y="64" width="96" height="34" rx="17" fill="#0d0f14" stroke="url(#brand)"/>
    <text x="1168" y="87" fill="#d8fff2" text-anchor="middle">AFTER</text>
  </g>

  <!-- caption -->
  <text x="640" y="492" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="600" fill="#aeb7c4" text-anchor="middle">
    ▶  Record a 6–10s clip and drop it here as assets/demo.gif
  </text>
</svg>
