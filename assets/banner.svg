<svg width="1280" height="340" viewBox="0 0 1280 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NVBroadcast for Linux">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ecc71"/>
      <stop offset="0.5" stop-color="#17c0b8"/>
      <stop offset="1" stop-color="#54a0ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#17c0b8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#17c0b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="360" y1="0" x2="980" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ecc71"/>
      <stop offset="0.42" stop-color="#17c0b8"/>
      <stop offset="0.5" stop-color="#eafff6"/>
      <stop offset="0.58" stop-color="#17c0b8"/>
      <stop offset="1" stop-color="#54a0ff"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-360 0; 360 0; -360 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="360" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ecc71"/>
      <stop offset="1" stop-color="#54a0ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="#0d0f14"/>

  <!-- broadcast rings behind the mark -->
  <g fill="none" stroke="url(#brand)" stroke-width="3">
    <circle cx="184" cy="170" r="70" opacity="0">
      <animate attributeName="r" values="70;150" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="184" cy="170" r="70" opacity="0">
      <animate attributeName="r" values="70;150" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- mark (logo geometry, scaled 0.5, placed left) -->
  <g transform="translate(56,42) scale(0.5)">
    <rect x="40" y="40" width="432" height="432" rx="104" fill="#0d0f14"/>
    <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#glow)"/>
    <rect x="43" y="43" width="426" height="426" rx="101" fill="none" stroke="url(#brand)" stroke-width="6"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#brand)" stroke-width="8" opacity="0.22"/>
    <polygon points="360,256 308,346.07 204,346.07 152,256 204,165.93 308,165.93"
             fill="none" stroke="url(#brand)" stroke-width="16" stroke-linejoin="round"/>
    <polygon points="360,256 308,346.07 204,346.07 152,256 204,165.93 308,165.93"
             fill="url(#brand)" opacity="0.10"/>

    <!-- iris blades rotate like an aperture -->
    <g stroke="url(#brand)" stroke-width="12" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 256 256" to="360 256 256" dur="24s" repeatCount="indefinite"/>
      <line x1="360" y1="256" x2="289.16" y2="278.37"/>
      <line x1="308" y1="346.07" x2="253.21" y2="295.90"/>
      <line x1="204" y1="346.07" x2="220.05" y2="273.54"/>
      <line x1="152" y1="256" x2="222.84" y2="233.63"/>
      <line x1="204" y1="165.93" x2="258.79" y2="216.10"/>
      <line x1="308" y1="165.93" x2="291.95" y2="238.46"/>
    </g>

    <circle cx="256" cy="256" r="34" fill="#0d0f14" stroke="url(#brand)" stroke-width="8"/>
    <circle cx="245" cy="245" r="10" fill="#eafff6" opacity="0.9"/>

    <!-- twinkling AI sparkle -->
    <path d="M382 132 L390 158 L416 166 L390 174 L382 200 L374 174 L348 166 L374 158 Z" fill="#eafff6">
      <animateTransform attributeName="transform" type="scale" additive="sum"
                        values="1;1.25;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- wordmark -->
  <text x="360" y="176" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif"
        font-size="92" font-weight="800" fill="url(#word)" letter-spacing="-1">NVBroadcast</text>
  <rect x="362" y="196" width="360" height="4" rx="2" fill="url(#rule)" opacity="0.9"/>
  <text x="364" y="240" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="500" fill="#aeb7c4">Real-time, real-looking virtual camera for Linux</text>

  <!-- feature pills -->
  <g font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    <g>
      <rect x="364" y="268" width="188" height="40" rx="20" fill="#141922" stroke="#252b36"/>
      <text x="458" y="294" fill="#d8fff2" text-anchor="middle">Alpha matting</text>
    </g>
    <g>
      <rect x="566" y="268" width="176" height="40" rx="20" fill="#141922" stroke="#252b36"/>
      <text x="654" y="294" fill="#d8fff2" text-anchor="middle">Studio Light</text>
    </g>
    <g>
      <rect x="756" y="268" width="176" height="40" rx="20" fill="#141922" stroke="#252b36"/>
      <text x="844" y="294" fill="#d8fff2" text-anchor="middle">Mic denoise</text>
    </g>
  </g>
</svg>
