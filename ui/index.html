<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NVBroadcast · Linux</title>
<style>
  :root { --bg:#0d0f14; --panel:#161a22; --line:#252b36; --fg:#e7ecf3;
          --mut:#8b94a3; --accent:#54a0ff; --accent2:#2ecc71; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:16px 22px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.2px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--accent2);
         box-shadow:0 0 8px var(--accent2); }
  .fps { margin-left:auto; color:var(--mut); font-variant-numeric:tabular-nums; }
  .wrap { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:22px;
          padding:22px; max-width:1200px; margin:0 auto; }
  @media (max-width:820px){ .wrap{ grid-template-columns:1fr; } }
  .stage { background:#000; border-radius:14px; overflow:hidden; border:1px solid var(--line);
           aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; }
  .stage img { width:100%; height:100%; object-fit:cover; display:block; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px;
           padding:18px; }
  .panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em;
              color:var(--mut); margin:0 0 12px; }
  .modes { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button.mode { background:#1e2530; color:var(--fg); border:1px solid var(--line);
                padding:10px; border-radius:9px; cursor:pointer; font-size:14px;
                transition:.15s; }
  button.mode:hover { border-color:var(--accent); }
  button.mode.active { background:var(--accent); border-color:var(--accent); color:#04121f; font-weight:600; }
  .row { margin-top:18px; }
  label.lbl { display:block; color:var(--mut); font-size:13px; margin-bottom:8px; }
  input[type=range]{ width:100%; accent-color:var(--accent); }
  .swatches { display:flex; gap:8px; flex-wrap:wrap; }
  .sw { width:30px; height:30px; border-radius:8px; cursor:pointer; border:2px solid transparent; }
  .sw:hover { border-color:#fff3; }
  .file { display:block; margin-top:8px; }
  .file input { display:none; }
  .file span { display:inline-block; background:#1e2530; border:1px solid var(--line);
               padding:9px 12px; border-radius:9px; cursor:pointer; font-size:13px; }
  .hint { color:var(--mut); font-size:12px; margin-top:16px; line-height:1.5; }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>NVBroadcast · Linux</h1>
  <span class="fps" id="fps">– fps</span>
</header>

<div class="wrap">
  <div class="stage"><img id="preview" src="/stream.mjpg" alt="preview"></div>

  <div class="panel">
    <h2>Background</h2>
    <div class="modes">
      <button class="mode" data-mode="none">Off</button>
      <button class="mode active" data-mode="blur">Blur</button>
      <button class="mode" data-mode="color">Color</button>
      <button class="mode" data-mode="image">Image</button>
    </div>

    <div class="row" id="blurRow">
      <label class="lbl">Blur strength <span id="blurVal">14</span></label>
      <input type="range" id="blur" min="2" max="40" step="1" value="14">
    </div>

    <div class="row" id="colorRow" style="display:none">
      <label class="lbl">Solid colour</label>
      <div class="swatches" id="swatches"></div>
    </div>

    <div class="row" id="imageRow" style="display:none">
      <label class="lbl">Background image</label>
      <label class="file"><input type="file" id="bgfile" accept="image/*"><span>Choose image…</span></label>
    </div>

    <p class="hint">Pick <b>“Broadcast Virtual Camera”</b> in Zoom / Meet / OBS /
    Discord. This preview is exactly what they receive.</p>
  </div>
</div>

<script>
const COLORS = [[46,204,113],[0,177,64],[52,152,219],[155,89,182],
                [231,76,60],[241,196,15],[236,240,241],[20,20,24]];
const $ = s => document.querySelector(s);
const post = (url, body) => fetch(url, {method:'POST',
  headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});

function showRows(mode){
  $('#blurRow').style.display  = mode==='blur'  ? '' : 'none';
  $('#colorRow').style.display = mode==='color' ? '' : 'none';
  $('#imageRow').style.display = mode==='image' ? '' : 'none';
}

document.querySelectorAll('button.mode').forEach(b => b.onclick = () => {
  document.querySelectorAll('button.mode').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  const m = b.dataset.mode;
  showRows(m);
  post('/api/mode', {mode:m});
});

$('#blur').oninput = e => {
  $('#blurVal').textContent = e.target.value;
  post('/api/blur', {sigma:+e.target.value});
};

const sw = $('#swatches');
COLORS.forEach(c => {
  const d = document.createElement('div');
  d.className = 'sw';
  d.style.background = `rgb(${c[0]},${c[1]},${c[2]})`;
  d.onclick = () => post('/api/color', {rgb:c});
  sw.appendChild(d);
});

$('#bgfile').onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const fd = new FormData(); fd.append('file', f);
  fetch('/api/bg', {method:'POST', body:fd});
};

setInterval(async () => {
  try { const s = await (await fetch('/api/status')).json();
        $('#fps').textContent = s.fps + ' fps'; } catch(e){}
}, 1000);
</script>
</body>
</html>
