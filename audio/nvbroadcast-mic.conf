# PipeWire filter-chain: a noise-cancelling virtual microphone powered by the
# DeepFilterNet LADSPA plugin. Run as its own process:
#     pipewire -c <this file>
# and a source named "NVBroadcast Microphone" appears; select it in your app.
# @PLUGIN@ is replaced with the absolute path to libdeep_filter_ladspa.so by
# scripts/mic_denoise.sh.
context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { nice.level = -11 }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    { name = libpipewire-module-filter-chain
        args = {
            node.description = "NVBroadcast Microphone"
            media.name       = "NVBroadcast Microphone"
            filter.graph = {
                nodes = [
                    {
                        type    = ladspa
                        name    = deepfilter
                        plugin  = "@PLUGIN@"
                        label   = deep_filter_mono
                        control = {
                            "Attenuation Limit (dB)" = 100
                        }
                    }
                ]
            }
            audio.rate = 48000
            capture.props = {
                node.name    = "NVBroadcast_Mic_input"
                node.passive = true
                audio.rate   = 48000
            }
            playback.props = {
                node.name        = "NVBroadcast_Mic"
                media.class      = "Audio/Source"
                node.description = "NVBroadcast Microphone"
                audio.rate       = 48000
            }
        }
    }
]
